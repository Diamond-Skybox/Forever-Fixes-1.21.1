modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"
description='''${mod_description}'''
[[mixins]]
config="foreverfixes.mixins.json"
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mobends"
    type="optional"
    versionRange="[5.6,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="waveycapes"
    type="optional"
    versionRange="[1.11,)"
    ordering="AFTER"
    side="CLIENT"
